name: firmware-test
on:
  push:
    branches: [firmware-test]

jobs:
  firmware:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h /
          nproc; free -g
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git ssh make gcc libssl-dev liblz4-tool expect g++ patchelf chrpath gawk texinfo diffstat binfmt-support qemu-user-static bison flex fakeroot cmake gcc-multilib g++-multilib unzip device-tree-compiler ncurses-dev bzip2 expat cpio python3 python3-pip libpython3-dev gperf libelf-dev xz-utils rsync bc lz4 wget curl file
      - name: Get SDK
        run: |
          git clone --depth 1 https://github.com/LuckfoxTECH/luckfox-pico.git sdk
          df -h /
      - name: Build (Mini, SPI NAND, Buildroot)
        working-directory: sdk
        run: |
          start=$(date +%s)
          printf '1\n1\n0\n' | ./build.sh lunch
          ./build.sh
          echo "BUILD SECONDS: $(( $(date +%s) - start ))"
      - name: Report
        if: always()
        run: |
          df -h /
          du -sh sdk 2>/dev/null
          ls -lh sdk/output/image 2>/dev/null
      - name: Analyze rootfs
        if: always()
        working-directory: sdk
        run: |
          ls -lh output/image || true
          R=$(ls -d sysdrv/out/rootfs_uclibc_rv1106 output/out/rootfs_uclibc_rv1106 2>/dev/null | head -1); echo "ROOTFS=$R"
          du -sh $R; du -s $R/* $R/usr/* $R/usr/lib/* $R/usr/bin/* 2>/dev/null | sort -rn | head -40
          ls $R/etc/init.d
          find sysdrv/source/buildroot -maxdepth 2 -name .config | head
          for f in $(find sysdrv/source/buildroot -maxdepth 2 -name .config | head -1); do grep -E "^BR2_PACKAGE_[A-Z0-9_]+=y" $f; done
          ls output/out 2>/dev/null; du -sh output/out/* 2>/dev/null
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: firmware
          path: sdk/output/image/*
